<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .s { fill: #ffffff; animation: tw 3.2s ease-in-out infinite; }
    .s2 { animation-delay: -1.1s; }
    .s3 { animation-delay: -2.3s; }
    @keyframes tw { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  </style>

  <rect width="900" height="420" rx="14" fill="#000814"/>

  <!-- starfield -->
  <g>
    <circle class="s" cx="34" cy="28" r="1.2"/><circle class="s s2" cx="120" cy="80" r="0.9"/>
    <circle class="s s3" cx="210" cy="22" r="1.4"/><circle class="s" cx="300" cy="64" r="0.8"/>
    <circle class="s s2" cx="388" cy="18" r="1.1"/><circle class="s s3" cx="470" cy="92" r="0.9"/>
    <circle class="s" cx="560" cy="36" r="1.3"/><circle class="s s2" cx="642" cy="74" r="0.8"/>
    <circle class="s s3" cx="730" cy="20" r="1.2"/><circle class="s" cx="820" cy="58" r="1"/>
    <circle class="s s2" cx="872" cy="130" r="1.3"/><circle class="s s3" cx="20" cy="150" r="1"/>
    <circle class="s" cx="96" cy="210" r="1.4"/><circle class="s s2" cx="60" cy="300" r="0.9"/>
    <circle class="s s3" cx="140" cy="370" r="1.2"/><circle class="s" cx="250" cy="400" r="0.8"/>
    <circle class="s s2" cx="180" cy="140" r="0.8"/><circle class="s s3" cx="840" cy="230" r="1"/>
    <circle class="s" cx="780" cy="320" r="1.4"/><circle class="s s2" cx="866" cy="390" r="0.9"/>
    <circle class="s s3" cx="700" cy="400" r="1.1"/><circle class="s" cx="760" cy="150" r="0.8"/>
    <circle class="s s2" cx="420" cy="140" r="0.7"/><circle class="s s3" cx="520" cy="170" r="0.9"/>
    <circle class="s" cx="330" cy="190" r="0.7"/><circle class="s s2" cx="610" cy="130" r="1"/>
  </g>

  <foreignObject x="0" y="0" width="900" height="420">
    <div xmlns="http://www.w3.org/1999/xhtml" class="stage">
      <style>
        .stage { position: relative; width: 900px; height: 420px; overflow: hidden;
                 font-family: "Franklin Gothic Medium", "Arial Narrow", Arial, sans-serif; }
        .intro { position: absolute; top: 160px; width: 100%; text-align: center;
                 color: #4BD5EE; font-size: 26px; letter-spacing: 1px; opacity: 0;
                 animation: intro 32s linear infinite; }
        .title { position: absolute; top: 140px; width: 100%; text-align: center;
                 color: #000814; font-size: 110px; font-weight: 900; letter-spacing: 10px;
                 -webkit-text-stroke: 3px #FFE81F; opacity: 0;
                 animation: title 32s ease-in infinite; }
        .crawl { position: absolute; left: 50%; bottom: 0; width: 640px; height: 900px;
                 margin-left: -320px; perspective: 620px; perspective-origin: 50% 100%;
                 -webkit-mask-image: linear-gradient(to bottom, transparent 30%, #000 62%);
                 mask-image: linear-gradient(to bottom, transparent 30%, #000 62%); }
        .text { position: absolute; top: 100%; width: 100%; color: #FFE81F;
                font-size: 30px; line-height: 1.35; text-align: justify;
                transform-origin: 50% 100%; animation: crawl 32s linear infinite; }
        .text h1, .text h2 { text-align: center; margin: 0; font-weight: 700; }
        .text h1 { font-size: 28px; letter-spacing: 3px; }
        .text h2 { font-size: 44px; margin-bottom: 30px; text-transform: uppercase; }
        .text p { margin: 0 0 30px 0; }
        @keyframes intro { 0% { opacity: 0; } 3% { opacity: 1; } 12% { opacity: 1; } 15% { opacity: 0; } 100% { opacity: 0; } }
        @keyframes title {
          0%, 15% { opacity: 0; transform: scale(2.6); }
          16% { opacity: 1; transform: scale(2.6); }
          34% { opacity: 1; transform: scale(0.15); }
          37%, 100% { opacity: 0; transform: scale(0.1); } }
        @keyframes crawl {
          0%, 18% { transform: rotateX(24deg) translateY(0); }
          100% { transform: rotateX(24deg) translateY(-1500px); } }
      </style>

      <div class="intro">In a distant corner of the<br/>open-source galaxy....</div>
      <div class="title">DEINICK</div>
      <div class="crawl"><div class="text">
        <h1>Chapter I</h1>
        <h2>The First Commit</h2>
        <p>It is a time of open source. A lone developer known as DEINICK has set out from the far edge of the internet, armed with a keyboard and an endless supply of coffee.</p>
        <p>Pursued by failing tests and merge conflicts, Deinick races across the galaxy, building tools, squashing bugs and pushing commits to restore order to the codebase....</p>
        <p>Pull requests are welcome. Stars fuel the hyperdrive. Fly safe, and ship often.</p>
      </div></div>
    </div>
  </foreignObject>
</svg>
